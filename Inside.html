<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kmoiprst</title>
<style>
  :root {
    --blue: #0a84ff;
    --blue-deep: #0018ff;
    --card: #4f86f0;
    --code-bg: #0018ff;
    --code-text: #2ef0ff;
    --pill-light: #8ec3ff;
    --white: #ffffff;
    --icon-soft: #c4d2ff;
    --shadow-sm: 0 3px 0 var(--blue-deep);
    --shadow-md: 0 4px 0 var(--blue-deep);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }

  html, body { height: 100%; }
  body {
    font-family: "Roboto", "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--white);
    background:
      radial-gradient(circle at 20% 15%, #0b2a6e 0, transparent 45%),
      radial-gradient(circle at 80% 30%, #7cc8ff 0, transparent 40%),
      radial-gradient(circle at 55% 75%, #46e3ff 0, transparent 35%),
      linear-gradient(160deg, #061a4a 0%, #2a5fd6 45%, #8c8cf0 70%, #1d4fb8 100%);
    background-attachment: fixed;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 480px;
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    position: relative;
    display: flex;
    flex-direction: column;
    padding-top: var(--safe-top);
  }

  /* ---------- Title pill ---------- */
  .title-pill {
    align-self: center;
    margin-top: 16px;
    min-width: 170px;
    max-width: calc(100% - 48px);
    padding: 10px 24px;
    background: var(--blue);
    border-radius: 999px;
    box-shadow: var(--shadow-md);
    text-align: center;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: .5px;
    text-transform: uppercase;
    text-shadow: 0 2px 3px rgba(0,0,0,.35);
    white-space: nowrap;
  }

  /* ---------- Scrollable content ---------- */
  .content {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 18px 14px calc(96px + var(--safe-bottom));
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    scrollbar-width: none;
  }
  .content::-webkit-scrollbar { display: none; }

  .view { display: none; }
  .view.active { display: block; }

  /* ---------- Cards ---------- */
  .card {
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--shadow-md);
    padding: 10px 10px 12px;
    margin: 0 0 14px;
  }
  .card-head {
    display: grid;
    grid-template-columns: 28px 1fr 28px;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .card-title {
    grid-column: 2;
    text-align: center;
    font-size: 15px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .3px;
    text-shadow: 0 2px 3px rgba(0,0,0,.35);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .icon-btn {
    width: 28px;
    height: 28px;
    border: none;
    background: none;
    color: var(--white);
    display: grid;
    place-items: center;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform .12s ease, background .12s ease;
  }
  .icon-btn:hover { background: rgba(255,255,255,.14); }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn:focus-visible { outline: 2px solid var(--pill-light); outline-offset: 2px; }
  .icon-btn svg { width: 20px; height: 20px; display: block; }

  .code-box {
    background: var(--code-bg);
    border-radius: 10px;
    padding: 10px;
    font-family: "Roboto Mono", Consolas, "Courier New", monospace;
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--code-text);
    white-space: pre;
    max-height: 190px;
    overflow: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    tab-size: 2;
  }

  /* Tutorial link card */
  .link-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    color: var(--white);
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform .12s ease;
  }
  .link-card:active { transform: scale(.98); }
  .link-card:focus-visible { outline: 2px solid var(--pill-light); outline-offset: 2px; }
  .link-card .bars {
    width: 26px;
    height: 20px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .link-card .bars span { display: block; height: 4px; background: var(--white); border-radius: 2px; }
  .link-card .body { flex: 1; min-width: 0; }
  .link-card .label {
    font-size: 14px;
    font-weight: 800;
    text-transform: uppercase;
    text-shadow: 0 2px 3px rgba(0,0,0,.3);
  }
  .link-card .sub {
    font-size: 12px;
    margin-top: 2px;
    opacity: .92;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .link-card .chev { width: 16px; height: 16px; flex-shrink: 0; }

  /* Project card */
  .project-card {
    display: grid;
    grid-template-columns: 28px 1fr 28px;
    align-items: center;
    gap: 8px;
    padding: 12px 10px;
  }
  .project-card .icon-btn { color: var(--white); width: 36px; height: 36px; }
  .project-card .icon-btn.is-off { opacity: .35; cursor: default; pointer-events: none; }
  .project-card .name {
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    text-shadow: 0 2px 3px rgba(0,0,0,.3);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .project-card .dl-icon { width: 24px; height: 24px; }
  .project-card .play-icon { width: 22px; height: 22px; }

  .empty {
    text-align: center;
    font-size: 13px;
    opacity: .85;
    margin-top: 24px;
  }

  /* ---------- Bottom bar ---------- */
  .bottom-bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: calc(10px + var(--safe-bottom));
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    z-index: 5;
    pointer-events: none;
  }
  .bottom-bar > * { pointer-events: auto; }

  .segment {
    flex: 1;
    min-width: 0;
    height: 44px;
    background: var(--blue);
    border-radius: 999px;
    box-shadow: var(--shadow-sm);
    display: flex;
    align-items: center;
    position: relative;
    padding: 3px;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-behavior: smooth;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
  }
  .segment::-webkit-scrollbar { display: none; }

  .segment button {
    flex: 0 0 auto;
    min-width: 46%;
    height: 100%;
    padding: 0 14px;
    border: none;
    background: transparent;
    color: var(--white);
    font: inherit;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .3px;
    white-space: nowrap;
    border-radius: 999px;
    cursor: pointer;
    position: relative;
    z-index: 1;
    pointer-events: none;
    transition: color .3s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .segment button:focus-visible { outline: 2px solid var(--white); outline-offset: -2px; }
  .segment button.on {
    color: var(--blue-deep);
    text-shadow: none;
  }

  /* Liquid-glass indicator: draggable, snaps to the nearest tab */
  .indicator {
    position: absolute;
    top: 3px;
    bottom: 3px;
    left: 0;
    width: 0;
    z-index: 0;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(255,255,255,.96) 0%, rgba(205,228,255,.8) 100%);
    border: 1px solid rgba(255,255,255,.75);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.9),
      inset 0 -3px 6px rgba(40,90,220,.25),
      0 4px 12px rgba(0,10,60,.35);
    transform: translate3d(var(--x, 0px), 0, 0);
    transition: transform .5s cubic-bezier(.34,1.56,.64,1), width .5s cubic-bezier(.34,1.56,.64,1);
    touch-action: none;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
  }
  .indicator::before {
    content: "";
    position: absolute;
    left: 12%;
    right: 12%;
    top: 4px;
    height: 42%;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,0));
    pointer-events: none;
  }
  .indicator.dragging {
    transition: width .3s ease;
    cursor: grabbing;
    transform: translate3d(var(--x, 0px), 0, 0) scale(1.06);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.9),
      inset 0 -3px 6px rgba(40,90,220,.25),
      0 8px 20px rgba(0,10,60,.45);
  }

  .search-fab {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid #4c3cff;
    background: var(--blue);
    box-shadow: var(--shadow-sm);
    color: var(--white);
    cursor: pointer;
    display: grid;
    place-items: center;
    -webkit-tap-highlight-color: transparent;
    transition: transform .12s ease;
  }
  .search-fab:active { transform: scale(.94); }
  .search-fab svg { width: 22px; height: 22px; display: block; }

  /* ---------- Search overlay ---------- */
  .search-view {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    z-index: 10;
    background: rgba(6, 26, 74, .45);
    padding: calc(16px + var(--safe-top)) 14px calc(70px + var(--safe-bottom));
  }
  .search-view.open { display: flex; }

  .search-title {
    margin-top: 6px;
    min-width: 170px;
    padding: 10px 24px;
    background: var(--blue);
    border-radius: 999px;
    box-shadow: var(--shadow-md);
    text-align: center;
    font-size: 22px;
    font-weight: 800;
    text-transform: uppercase;
    text-shadow: 0 2px 3px rgba(0,0,0,.35);
  }

  .search-results {
    width: 100%;
    max-width: 480px;
    flex: 1;
    min-height: 0;
    margin-top: 12px;
    padding: 2px 2px 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: none;
  }
  .search-results::-webkit-scrollbar { display: none; }

  .result {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--card);
    border: none;
    border-radius: 10px;
    box-shadow: var(--shadow-sm);
    color: var(--white);
    font: inherit;
    font-size: 13px;
    text-align: left;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .result:active { transform: scale(.99); }
  .result { padding: 12px 14px; }
  .result .label-text {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .search-results .empty { margin-top: 40px; font-size: 14px; }
  .result .tag { flex-shrink: 0; font-size: 11px; font-weight: 800; text-transform: uppercase; }

  .search-bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: calc(10px + var(--safe-bottom));
    padding: 0 12px;
    display: flex;
    gap: 6px;
  }
  .search-bar .box {
    flex: 1;
    min-width: 0;
    height: 46px;
    background: var(--blue);
    border-radius: 999px;
    box-shadow: var(--shadow-sm);
    display: flex;
    align-items: center;
    padding: 0 6px 0 16px;
  }
  .search-bar input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: var(--white);
    font: inherit;
    font-size: 14px;
    font-weight: 700;
  }
  .search-bar input::placeholder { color: #dbe9ff; opacity: .9; }
  .search-bar .close {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    border-radius: 50%;
    border: none;
    background: #6eb5ff;
    color: var(--white);
    cursor: pointer;
    display: grid;
    place-items: center;
  }
  .search-bar .close svg { width: 18px; height: 18px; display: block; }

  /* ---------- Toast ---------- */
  /* ---- Search morph: navigation shrinks, search button expands into the typing field ---- */
  .bottom-bar { z-index: 12; align-items: center; }

  .segment {
    flex: 1 1 auto;
    transition: flex-grow .5s cubic-bezier(.2,.8,.2,1), flex-basis .5s cubic-bezier(.2,.8,.2,1);
  }
  .segment button { transition: opacity .25s ease, color .3s ease; }
  .segment .indicator {
    transition: transform .5s cubic-bezier(.34,1.56,.64,1), width .5s cubic-bezier(.34,1.56,.64,1), opacity .25s ease;
  }
  .seg-dots {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 20px;
    height: 20px;
    transform: translate(-50%, -50%);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    opacity: 0;
    transition: opacity .3s ease;
    pointer-events: none;
  }
  .seg-dots i { display: block; width: 7px; height: 7px; border-radius: 50%; background: #fff; }

  .bottom-bar.searching .segment {
    flex: 0 0 48px;
    min-width: 48px;
    overflow: hidden;
  }
  .bottom-bar.searching .segment button,
  .bottom-bar.searching .segment .indicator { opacity: 0; pointer-events: none; }
  .bottom-bar.searching .seg-dots { opacity: 1; }

  .search-fab {
    flex: 0 0 48px;
    width: auto;
    height: 48px;
    padding: 0;
    border-radius: 999px;
    display: flex;
    align-items: center;
    overflow: hidden;
    transition: flex-grow .5s cubic-bezier(.2,.8,.2,1), flex-basis .5s cubic-bezier(.2,.8,.2,1);
  }
  .bottom-bar.searching .search-fab { flex: 1 1 0%; }

  .fab-icon {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
    border: none;
    background: transparent;
    color: #fff;
    display: grid;
    place-items: center;
    cursor: pointer;
    padding: 0;
  }
  .fab-icon svg { width: 22px; height: 22px; }

  .search-fab input {
    flex: 1;
    min-width: 0;
    height: 100%;
    padding: 0 6px;
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
  }
  .search-fab input::placeholder { color: #dbe9ff; opacity: .9; }
  .bottom-bar.searching .search-fab input { opacity: 1; pointer-events: auto; transition-delay: .2s; }

  .fab-close {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    margin-right: 6px;
    border: none;
    border-radius: 50%;
    background: #6eb5ff;
    color: #fff;
    display: grid;
    place-items: center;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .fab-close svg { width: 16px; height: 16px; }
  .bottom-bar.searching .fab-close { opacity: 1; pointer-events: auto; transition-delay: .2s; }

  .toast {
    position: fixed;
    top: calc(14px + var(--safe-top));
    left: 50%;
    transform: translate(-50%, -140px);
    background: var(--white);
    color: var(--blue-deep);
    font-size: 12px;
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 999px;
    box-shadow: 0 4px 12px rgba(0,0,0,.2);
    transition: transform .3s ease;
    z-index: 20;
    pointer-events: none;
  }
  .toast.show { transform: translate(-50%, 0); }

  /* iOS lock-screen -> home-screen style zoom-in entrance */
  @keyframes zoomIn {
    0%   { opacity: 0; transform: scale(1.22); filter: blur(10px); }
    55%  { opacity: 1; filter: blur(0); }
    100% { opacity: 1; transform: scale(1); filter: blur(0); }
  }
  .enter {
    /* "backwards" keeps the start state during the delay but releases transform afterwards,
       so :active press effects keep working */
    animation: zoomIn .75s cubic-bezier(.2,.8,.2,1) backwards;
    animation-delay: var(--d, 0ms);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; }
    .enter { animation: none !important; }
  }
  /* Footer label at the end of every page */
  .site-footer {
    margin: 28px 0 0;
    text-align: center;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 4px;
    color: rgba(255, 255, 255, .6);
    text-shadow: 0 1px 2px rgba(0,0,0,.3);
    user-select: none;
  }
  /* ---- Search dots icon (in the shrunken navigation) ---- */
  .segment::after { content: none; }
  .dots {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 20px;
    height: 20px;
    transform: translate(-50%, -50%);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    opacity: 0;
    transition: opacity .3s ease;
    pointer-events: none;
  }
  .dots i {
    display: block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ffffff;
  }
  .bottom-bar.searching .dots { opacity: 1; }

  /* ---- Background video (plays automatically, muted, looping) ---- */
  .bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
    pointer-events: none;
  }
  .bg-dim {
    position: fixed;
    inset: 0;
    background: rgba(4, 12, 40, .25);
    z-index: -1;
    pointer-events: none;
  }

  /* ---- UI polish ---- */
  .content { display: flex; flex-direction: column; }
  .content > * { flex-shrink: 0; }
  .site-footer { margin-top: auto; padding-top: 28px; }
  .content, .title-pill { transition: opacity .3s ease; }
  body.searching .content,
  body.searching .title-pill { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<video class="bg-video" id="bgVideo" autoplay muted loop playsinline preload="auto" aria-hidden="true">
  <source src="background.mp4" type="video/mp4">
</video>
<div class="bg-dim" aria-hidden="true"></div>
<div class="app">

  <div class="title-pill" id="pageTitle">Expression</div>

  <main class="content">
    <section class="view active" id="view-expression">
      <div id="expressionList"></div>
      <div class="empty" id="expressionEmpty" hidden>No expressions yet.</div>
    </section>

    <section class="view" id="view-tutorial">
      <div id="tutorialList"></div>
      <div class="empty" id="tutorialEmpty" hidden>No tutorials yet.</div>
    </section>

    <section class="view" id="view-project">
      <div id="projectList"></div>
      <div class="empty" id="projectEmpty" hidden>No projects yet.</div>
    </section>
    <footer class="site-footer">KMOIPRST</footer>
  </main>

  <nav class="bottom-bar">
    <div class="segment" id="segment" role="tablist">
      <span class="indicator" id="indicator" aria-hidden="true"></span>
      <span class="seg-dots" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <button type="button" role="tab" data-tab="expression" class="on" aria-selected="true">Expression</button>
      <button type="button" role="tab" data-tab="tutorial" aria-selected="false">Tutorial</button>
      <button type="button" role="tab" data-tab="project" aria-selected="false">Projects</button>
    </div>
    <div class="search-fab" id="searchFab">
    <button class="fab-icon" id="searchBtn" type="button" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
        <circle cx="10" cy="10" r="6.5"/><line x1="15" y1="15" x2="21" y2="21"/>
      </svg>
    </button>
    <input id="searchInput" type="text" placeholder="Search..." autocomplete="off" aria-label="Search text">
    <button class="fab-close" id="searchClose" type="button" aria-label="Close search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
        <line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>
      </svg>
    </button>
    </div>
  </nav>

  <div class="search-view" id="searchView" role="dialog" aria-modal="true" aria-label="Search">
    <div class="search-title">Search</div>
    <div class="search-results" id="searchResults"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">Copied!</div>
</div>

<script>
  /* ====== DATA: replace with your real tutorials / expressions / projects ====== */
  const DATA = {
    expressions: [
      {
        id: "e1",
        title: "Jedug Shake",
        code: `amp = 30;    // circle size (px)
turns = 1;   // circles per marker gap
ease = 2;    // 1 = constant speed, 2-3 = fast start, soft ease out

n = 0;
if (marker.numKeys > 0) {
  n = marker.nearestKey(time).index;
  if (marker.key(n).time > time) n--;
}`
      }
    ],
    tutorials: [
      { id: "t1", title: "Tutorial Link!!", subtitle: "How to use project", url: "https://www.tiktok.com/@yourname/video/REPLACE-TUTORIAL" }   // TikTok tutorial link
    ],
    projects: [
      {
        id: "p1",
        name: "1-kmoiprstkf",
        driveUrl: "https://drive.google.com/REPLACE-WITH-YOUR-LINK",   // download button
        tiktokUrl: "https://www.tiktok.com/@yourname/video/REPLACE"    // play / arrow button
      }
    ]
  };

  /* ====== HELPERS ====== */
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const ICON_COPY = `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="13" height="13" rx="2.5" fill="currentColor" opacity=".5"/><rect x="3" y="7" width="13" height="13" rx="2.5" fill="currentColor"/></svg>`;
  const ICON_DL = `<svg class="dl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 16v4h16v-4"/></svg>`;
  const ICON_PLAY = `<svg class="play-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>`;
  const ICON_CHEV = `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>`;
  const ICON_MENU = `<div class="bars" aria-hidden="true"><span></span><span></span></div>`;

  let toastTimer;
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1400);
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      toast("Copied!");
    } catch {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch {}
      ta.remove();
      toast(ok ? "Copied!" : "Copy failed");
    }
  }

  /* ====== RENDER ====== */
  function renderExpressions() {
    $("#expressionList").innerHTML = DATA.expressions.map(e => `
      <article class="card">
        <header class="card-head">
          <span></span>
          <h2 class="card-title">${esc(e.title)}</h2>
          <button class="icon-btn" type="button" data-copy="${esc(e.id)}" aria-label="Copy code">${ICON_COPY}</button>
        </header>
        <pre class="code-box">${esc(e.code)}</pre>
      </article>`).join("");
    $("#expressionEmpty").hidden = DATA.expressions.length > 0;
  }

  function renderTutorials() {
    $("#tutorialList").innerHTML = DATA.tutorials.map(t => `
      <a class="card link-card" href="${esc(t.url)}" target="_blank" rel="noopener">
        ${ICON_MENU}
        <div class="body">
          <div class="label">${esc(t.title)}</div>
          <div class="sub">${esc(t.subtitle)}</div>
        </div>
        ${ICON_CHEV}
      </a>`).join("");
    $("#tutorialEmpty").hidden = DATA.tutorials.length > 0;
  }

  function renderProjects() {
    // Download (tray icon) -> Google Drive link; Play (triangle) -> TikTok link
    const linkBtn = (url, icon, label) => url
      ? `<a class="icon-btn" href="${esc(url)}" target="_blank" rel="noopener" aria-label="${label}">${icon}</a>`
      : `<span class="icon-btn is-off" aria-label="${label} (no link yet)">${icon}</span>`;

    $("#projectList").innerHTML = DATA.projects.map(p => `
      <div class="card project-card">
        ${linkBtn(p.driveUrl, ICON_DL, "Download " + esc(p.name) + " from Google Drive")}
        <div class="name">${esc(p.name)}</div>
        ${linkBtn(p.tiktokUrl, ICON_PLAY, "Watch " + esc(p.name) + " on TikTok")}
      </div>`).join("");
    $("#projectEmpty").hidden = DATA.projects.length > 0;
  }

  /* ====== TAB NAVIGATION ====== */
  const TITLES = { expression: "Expression", tutorial: "Tutorial", project: "Project" };
  const segment = $("#segment");

  const indicator = $("#indicator");
  const tabButtons = [...segment.querySelectorAll("button[data-tab]")];
  let currentTab = "expression";
  let xPos = 0;

  function setIndicatorX(x) {
    xPos = x;
    indicator.style.setProperty("--x", x + "px");
  }

  function placeIndicator(btn) {
    indicator.style.width = btn.offsetWidth + "px";
    setIndicatorX(btn.offsetLeft);
  }

  function showTab(tab) {
    const changed = tab !== currentTab;
    currentTab = tab;
    document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + tab));
    tabButtons.forEach(b => {
      const on = b.dataset.tab === tab;
      b.classList.toggle("on", on);
      b.setAttribute("aria-selected", on ? "true" : "false");
    });
    const activeBtn = tabButtons.find(b => b.dataset.tab === tab);
    if (activeBtn) placeIndicator(activeBtn);
    $("#pageTitle").textContent = TITLES[tab];
    if (changed) {
      $(".content").scrollTop = 0;
      animateView(tab);
    }
  }

  /* ---- Draggable glass indicator ---- */
  let drag = null;

  indicator.addEventListener("pointerdown", (e) => {
    drag = { startPointer: e.clientX, startX: xPos };
    indicator.setPointerCapture(e.pointerId);
    indicator.classList.add("dragging");
  });

  indicator.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const first = tabButtons[0].offsetLeft;
    const last = tabButtons[tabButtons.length - 1].offsetLeft;
    const x = drag.startX + (e.clientX - drag.startPointer);
    setIndicatorX(Math.min(last, Math.max(first, x)));
  });

  function endDrag() {
    if (!drag) return;
    drag = null;
    indicator.classList.remove("dragging");
    const center = xPos + indicator.offsetWidth / 2;
    let nearest = tabButtons[0];
    let best = Infinity;
    tabButtons.forEach(b => {
      const d = Math.abs(b.offsetLeft + b.offsetWidth / 2 - center);
      if (d < best) { best = d; nearest = b; }
    });
    showTab(nearest.dataset.tab);
    nearest.scrollIntoView({ behavior: "smooth", inline: "nearest", block: "nearest" });
  }
  indicator.addEventListener("pointerup", endDrag);
  indicator.addEventListener("pointercancel", endDrag);

  function refreshIndicator() {
    const b = tabButtons.find(x => x.dataset.tab === currentTab);
    if (b) placeIndicator(b);
  }
  window.addEventListener("resize", refreshIndicator);
  window.addEventListener("load", refreshIndicator);

  /* ====== FIREBASE SYNC (data written by the admin panel) ====== */
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyBZFlSzF8rFlsQPF7oBORVbVno2b9nhusE",
    authDomain: "kmoi0n.firebaseapp.com",
    projectId: "kmoi0n",
    storageBucket: "kmoi0n.firebasestorage.app",
    messagingSenderId: "311955904266",
    appId: "1:311955904266:web:0370758e8924d405930cf3",
    databaseURL: "https://kmoi0n-default-rtdb.firebaseio.com"
  };
  const DB_ROOT = "site";   // same path the admin panel writes to

  /* Firebase stores each item as { key: { ...fields } }; turn that into a list, newest first */
  function mapItems(v, mapper) {
    if (!v) return [];
    return Object.entries(v)
      .filter(([, item]) => item)
      .map(([id, item]) => mapper(id, item))
      .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  }

  /* Admin panel fields -> viewer fields */
  const toProject = (id, p) => ({
    id,
    createdAt: p.createdAt,
    name: p.title || "",
    driveUrl: p.driveLink || "",     // download button (add a Drive field in admin, see notes)
    tiktokUrl: p.link || ""          // play / arrow button
  });
  const toTutorial = (id, t) => ({
    id,
    createdAt: t.createdAt,
    title: t.title || "",
    subtitle: t.desc || "",
    url: t.link || ""
  });
  const toExpression = (id, e) => ({
    id,
    createdAt: e.createdAt,
    title: e.title || "",
    code: e.code || ""
  });

  function syncFromFirebase() {
    if (!window.firebase || FIREBASE_CONFIG.apiKey === "REPLACE") return;
    try {
      if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      firebase.database().ref(DB_ROOT).on("value", (snap) => {
        const site = snap.val() || {};
        DATA.expressions = mapItems(site.expressions, toExpression);
        DATA.tutorials = mapItems(site.tutorials, toTutorial);
        DATA.projects = mapItems(site.projects, toProject);
        renderExpressions();
        renderTutorials();
        renderProjects();
      });
    } catch (err) {
      console.error("Firebase sync failed:", err);
    }
  }
  window.addEventListener("load", syncFromFirebase);

  /* Background video: autoplay muted; removed if no URL is set yet */
  (function setupBgVideo() {
    const v = document.getElementById("bgVideo");
    if (!v) return;
    const src = v.querySelector("source").getAttribute("src") || "";
    if (!src || src.includes("REPLACE")) { v.remove(); document.querySelector(".bg-dim")?.remove(); return; }
    v.muted = true;
    const p = v.play();
    if (p && p.catch) p.catch(() => {});
  })();

  segment.addEventListener("click", (e) => {
    if (bottomBar.classList.contains("searching")) { closeSearch(); return; }
    // Keyboard activation targets the button directly; pointer taps are matched by position
    let btn = e.target.closest("button[data-tab]");
    if (!btn) {
      btn = tabButtons.find(b => {
        const r = b.getBoundingClientRect();
        return e.clientX >= r.left && e.clientX <= r.right;
      });
    }
    if (!btn) return;
    showTab(btn.dataset.tab);
    btn.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
  });

  /* Copy handler (event delegation) */
  document.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-copy]");
    if (!btn) return;
    const item = DATA.expressions.find(x => x.id === btn.dataset.copy);
    if (item) copyText(item.code);
  });

  /* ====== SEARCH ====== */
  const searchView = $("#searchView");
  const searchInput = $("#searchInput");
  const bottomBar = document.querySelector(".bottom-bar");
  let currentResults = [];

  function allItems() {
    return [
      ...DATA.tutorials.map(t => ({ kind: "TUTORIAL", label: t.subtitle || t.title, go: () => window.open(t.url, "_blank", "noopener") })),
      ...DATA.expressions.map(e => ({ kind: "EXPRESSION", label: e.title, go: () => { showTab("expression"); copyText(e.code); } })),
      ...DATA.projects.map(p => ({ kind: "PROJECT", label: p.name, go: () => showTab("project") }))
    ];
  }

  function renderSearch() {
    const q = searchInput.value.trim().toLowerCase();
    currentResults = allItems().filter(i => !q || i.label.toLowerCase().includes(q) || i.kind.toLowerCase().includes(q));
    const list = $("#searchResults");
    if (!currentResults.length) {
      list.innerHTML = `<div class="empty">No results</div>`;
      return;
    }
    list.innerHTML = currentResults.map((r, idx) => `
      <button class="result" type="button" data-idx="${idx}">
        <span class="label-text">${esc(r.label)}</span>
        <span class="tag">${r.kind}</span>
      </button>`).join("");
  }

  $("#searchResults").addEventListener("click", (e) => {
    const btn = e.target.closest(".result");
    if (!btn) return;
    const item = currentResults[Number(btn.dataset.idx)];
    closeSearch();
    if (item) item.go();
  });

  /* Results rise up from the search bar, one after another */
  function animateResults() {
    const items = [...document.querySelectorAll("#searchResults .result, #searchResults .empty")];
    items.forEach((el, i) => {
      if (!el.animate) return;
      el.animate(
        [
          { opacity: 0, transform: "translateY(90px) scale(.9)" },
          { opacity: 1, transform: "translateY(0) scale(1)" }
        ],
        {
          duration: 480,
          delay: 60 + i * 50,
          easing: "cubic-bezier(.2,.9,.25,1)",
          fill: "backwards"
        }
      );
    });
  }

  function openSearch() {
    if (searchView.classList.contains("open")) { searchInput.focus(); return; }
    searchView.classList.add("open");
    bottomBar.classList.add("searching");
    document.body.classList.add("searching");
    renderSearch();
    animateResults();
    setTimeout(() => searchInput.focus(), 450);
  }
  function closeSearch() {
    if (!searchView.classList.contains("open")) return;
    searchView.classList.remove("open");
    bottomBar.classList.remove("searching");
    document.body.classList.remove("searching");
    setTimeout(refreshIndicator, 520);
    searchInput.value = "";
    searchInput.blur();
  }

  $("#searchBtn").addEventListener("click", openSearch);
  $("#searchClose").addEventListener("click", closeSearch);
  searchInput.addEventListener("input", renderSearch);
  searchView.addEventListener("click", (e) => { if (e.target === searchView) closeSearch(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSearch(); });

  /* ====== INIT ====== */
  renderExpressions();
  renderTutorials();
  renderProjects();
  showTab("expression");

  /* iOS-style zoom-in: each layer scales from slightly large to normal, staggered */
  function zoomIn(elements) {
    elements.forEach((el, i) => {
      if (!el || !el.animate) return;
      el.animate(
        [
          { opacity: 0, transform: "scale(1.22)" },
          { opacity: 1, transform: "scale(1)" }
        ],
        {
          duration: 750,
          delay: i * 90,
          easing: "cubic-bezier(.2,.8,.2,1)",
          fill: "backwards"
        }
      );
    });
  }

  /* Cards and empty messages inside a given page */
  function viewLayers(tab) {
    return [...document.querySelectorAll(`#view-${tab} .card, #view-${tab} .empty`)];
  }

  /* Page open: title, cards, then the navigation */
  zoomIn([$(".title-pill"), ...viewLayers("expression"), $(".bottom-bar")]);

  /* Each time a page is opened from the navigation */
  function animateView(tab) {
    zoomIn([$(".title-pill"), ...viewLayers(tab)]);
  }
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</body>
