<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kmoiprst</title>
<style>
  :root {
    --blue: #0a84ff;
    --blue-deep: #0018ff;
    --card: #4f86f0;
    --code-bg: #0018ff;
    --code-text: #2ef0ff;
    --pill-light: #8ec3ff;
    --white: #ffffff;
    --icon-soft: #c4d2ff;
    --shadow-sm: 0 3px 0 var(--blue-deep);
    --shadow-md: 0 4px 0 var(--blue-deep);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }

  html, body { height: 100%; }
  body {
    font-family: "Roboto", "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--white);
    background:
      radial-gradient(circle at 20% 15%, #0b2a6e 0, transparent 45%),
      radial-gradient(circle at 80% 30%, #7cc8ff 0, transparent 40%),
      radial-gradient(circle at 55% 75%, #46e3ff 0, transparent 35%),
      linear-gradient(160deg, #061a4a 0%, #2a5fd6 45%, #8c8cf0 70%, #1d4fb8 100%);
    background-attachment: fixed;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 480px;
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    position: relative;
    display: flex;
    flex-direction: column;
    padding-top: var(--safe-top);
  }

  /* ---------- Title pill ---------- */
  .title-pill {
    align-self: center;
    margin-top: 16px;
    min-width: 170px;
    max-width: calc(100% - 48px);
    padding: 10px 24px;
    background: var(--blue);
    border-radius: 999px;
    box-shadow: var(--shadow-md);
    text-align: center;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: .5px;
    text-transform: uppercase;
    text-shadow: 0 2px 3px rgba(0,0,0,.35);
    white-space: nowrap;
  }

  /* ---------- Scrollable content ---------- */
  .content {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 18px 14px calc(96px + var(--safe-bottom));
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    scrollbar-width: none;
  }
  .content::-webkit-scrollbar { display: none; }

  .view { display: none; }
  .view.active { display: block; }

  /* ---------- Cards ---------- */
  .card {
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--shadow-md);
    padding: 10px 10px 12px;
    margin: 0 0 14px;
  }
  .card-head {
    display: grid;
    grid-template-columns: 28px 1fr 28px;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .card-title {
    grid-column: 2;
    text-align: center;
    font-size: 15px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .3px;
    text-shadow: 0 2px 3px rgba(0,0,0,.35);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .icon-btn {
    width: 28px;
    height: 28px;
    border: none;
    background: none;
    color: var(--white);
    display: grid;
    place-items: center;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform .12s ease, background .12s ease;
  }
  .icon-btn:hover { background: rgba(255,255,255,.14); }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn:focus-visible { outline: 2px solid var(--pill-light); outline-offset: 2px; }
  .icon-btn svg { width: 20px; height: 20px; display: block; }

  .code-box {
    background: var(--code-bg);
    border-radius: 10px;
    padding: 10px;
    font-family: "Roboto Mono", Consolas, "Courier New", monospace;
    font-size: 11.5px;
